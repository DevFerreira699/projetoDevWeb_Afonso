<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carros fodão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Amantes de veiculos: PIAGET ADS</h1>

        <form id="formCarPerson">
            <input type="text" id="nome" placeholder="Nome" aria-label="Nome" required>
            <input type="text" id="veiculo" placeholder="Veículo" aria-label="Veículo">
            <input type="text" id="motos" placeholder="Moto" aria-label="Moto">

            <button id="btnSalvar" type="submit">Cadastrar</button>
        </form>

        <div class="tabela-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Nome</th>
                        <th>Veículo</th>
                        <th>Motos</th>
                    </tr>
                </thead>

                <tbody id="corpoTabela"></tbody>
            </table>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
